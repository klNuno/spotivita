name: Linter

on: [push, pull_request]

jobs:
  lint:
    strategy:
        matrix:
          os: [ubuntu-latest]
        fail-fast: false
    runs-on:  ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Install cpplint
      # ubuntu-24.04 refuses a system-wide pip install (PEP 668).
      run: pipx install cpplint

    - name: Install cppcheck
      run: sudo apt -y install cppcheck

    - name: lint
      run: ./lint

  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build deps
      run: apk add --no-cache protobuf protobuf-dev cmake make git

    - name: Build VPK
      run: |
        mkdir build && cd build
        cmake .. && make -j$(nproc)
