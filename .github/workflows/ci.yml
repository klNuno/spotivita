name: CI

on: [push, pull_request]

jobs:
  lint:
    strategy:
        matrix:
          os: [ubuntu-latest]
        fail-fast: false
    runs-on:  ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Install cpplint
      # ubuntu-24.04 refuses a system-wide pip install (PEP 668).
      run: pipx install cpplint

    - name: Install cppcheck
      run: sudo apt -y install cppcheck

    - name: lint
      run: ./lint

  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # The image is Ubuntu 24.04 with the whole vdpm catalogue (vita2d,
    # imgui-vita2d, curl, openssl). nanopb only needs protoc, its Python
    # bindings and pkg_resources (setuptools) on the host.
    - name: Install build deps
      run: |
        apt-get update
        apt-get install -y --no-install-recommends protobuf-compiler python3-protobuf python3-setuptools

    # The full image resolves curl's openssl dependency with openssl-1.1.1,
    # but vdpm's libcurl.a is built against the 1.0.2 API (SSLeay,
    # EVP_MD_CTX_create): the link fails. Put the 1.0.2 package back.
    - name: Swap OpenSSL 1.1.1 for 1.0.2
      env:
        VDPM_NONINTERACTIVE: 1
      run: |
        vdpm remove -dd openssl-1.1.1
        vdpm install openssl

    - name: Build VPK
      run: |
        mkdir build && cd build
        cmake .. && make -j$(nproc)

    # A weak pthread symbol means std::mutex or std::condition_variable is a
    # no-op or jumps to 0 at runtime (see the --undefined loop in CMakeLists.txt).
    - name: No weak pthread symbols
      run: "! arm-vita-eabi-nm build/spotivita | grep ' w pthread'"

    - uses: actions/upload-artifact@v4
      with:
        name: spotivita-vpk
        path: build/spotivita.vpk
